<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PhotocardMaker · Template QA</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Allura&family=Bebas+Neue&family=Bodoni+Moda:wght@400;600&family=Bungee&family=Caveat:wght@400;600&family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@400;600&family=DM+Serif+Display&family=Dancing+Script:wght@400;600&family=Great+Vibes&family=Inter:wght@400;600&family=Libre+Baskerville:wght@400;700&family=Lora:wght@400;600&family=Montserrat:wght@400;600&family=Orbitron:wght@400;600&family=Oswald:wght@400;600&family=Pacifico&family=Parisienne&family=Playfair+Display:wght@400;600&family=Poppins:wght@400;600&family=Prata&family=Press+Start+2P&family=Quicksand:wght@400;600&family=Raleway:wght@400;600&family=Righteous&family=Sacramento&family=Satisfy&family=Space+Grotesk:wght@400;600&family=Unbounded:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1e2430;background:#f4f6f9}
    *{box-sizing:border-box} body{margin:0;padding:24px}
    .wrap{max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}
    h1{margin:0;font-size:26px}.muted{color:#687386}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}
    .pill{background:#fff;border:1px solid #dfe5ec;border-radius:999px;padding:8px 12px;font-weight:700}.pass{color:#137333}.fail{color:#b3261e}
    button{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer;background:#1f6feb;color:#fff}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
    .card{background:#fff;border:1px solid #dfe5ec;border-radius:15px;padding:12px;box-shadow:0 3px 14px rgba(30,45,65,.05)}
    .card.fail-card{border-color:#e6a39e}.title{font-weight:800;margin-bottom:8px}.canvases{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    canvas{width:100%;height:auto;border-radius:8px;background:#e9edf2;border:1px solid #dfe5ec}.side{text-align:center;font-size:11px;color:#687386;margin-top:4px}
    .error{margin-top:8px;color:#b3261e;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
  </style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>Template QA</h1><div class="muted">47개 템플릿의 앞/뒷면을 합성 샘플로 자동 렌더링합니다.</div></div>
    <button id="runBtn" type="button">다시 검사</button>
  </div>
  <div id="summary" class="summary"></div>
  <div id="grid" class="grid"></div>
</div>
<script type="module" src="./qa.js?v=5"></script>
</body>
</html>
